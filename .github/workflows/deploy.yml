name: Deploy to GitHub Pages

# Builds the site and publishes it, so the live page always matches main.
#
# The tests run first and the job stops if they fail. That matters more here
# than on most sites: the physics is checked against closed-form values and the
# copy is checked for jargon, so a red build genuinely means something is wrong
# with what a student would read.

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Requires Pages to be enabled once, by hand:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The `enablement` option exists but the default workflow token is not
      # permitted to turn Pages on, so relying on it just fails here instead.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
